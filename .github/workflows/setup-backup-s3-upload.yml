name: (12) Setup DB backup S3 upload

# pg_dump 백업본을 S3(비공개 버킷)로 매일 올리도록 설정한다.
# 지금은 백업이 EC2 디스크에만 있어서 인스턴스가 사라지면 백업도 같이 사라진다
# (2026-07-15에 실제로 그렇게 DB를 잃은 적 있음).
#
# 이미 잘 돌고 있는 backup_db.sh는 건드리지 않는다 — 별도 업로드 스크립트를 두고
# 백업 크론(18:00 UTC = 03:00 KST) 15분 뒤에 따로 실행한다. 업로드가 실패해도
# 로컬 백업 자체는 영향받지 않는다.
#
# 멱등: 여러 번 실행해도 크론이 중복 등록되지 않는다.

on:
  workflow_dispatch:

env:
  BUCKET: joyhill-db-backups
  REGION: ap-northeast-2

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install uploader script and cron
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: BUCKET,REGION
          script: |
            set -e
            SRC=/var/backups/joyhill-db
            SCRIPT="$HOME/upload_backups_s3.sh"

            echo "==================== 현재 상태 ===================="
            echo "백업 디렉토리:"; ls -1 "$SRC" 2>/dev/null | tail -3 || echo "(없음)"
            echo "현재 크론탭:"; crontab -l 2>/dev/null || echo "(없음)"

            echo
            echo "==================== AWS CLI 확인 ===================="
            if command -v aws >/dev/null 2>&1; then
              echo "이미 설치됨: $(aws --version 2>&1)"
            else
              echo "설치 안 됨 → apt로 설치"
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq awscli
              echo "설치 완료: $(aws --version 2>&1)"
            fi

            echo
            echo "==================== 업로드 스크립트 생성 ===================="
            cat > "$SCRIPT" <<EOF
            #!/bin/bash
            # pg_dump 백업본을 S3로 동기화. --delete를 쓰지 않으므로 로컬에서 14일 순환으로
            # 지워진 뒤에도 S3에는 남는다(장기 보관은 버킷 수명 주기 규칙으로 관리).
            set -euo pipefail
            export AWS_DEFAULT_REGION=$REGION
            aws s3 sync "$SRC" "s3://$BUCKET/" --exclude "*" --include "*.dump"
            echo "[\$(date -Is)] sync 완료"
            EOF
            chmod +x "$SCRIPT"
            echo "생성됨: $SCRIPT"
            cat "$SCRIPT"

            echo
            echo "==================== 시험 실행 (IAM 권한 확인 겸) ===================="
            if "$SCRIPT"; then
              echo "업로드 성공"
            else
              echo "!!! 업로드 실패 — IAM 역할에 이 버킷 쓰기 권한이 있는지 확인 필요 !!!"
              exit 1
            fi

            echo
            echo "==================== S3에 올라간 파일 확인 ===================="
            AWS_DEFAULT_REGION=$REGION aws s3 ls "s3://$BUCKET/" | tail -5
            echo "총 개수: $(AWS_DEFAULT_REGION=$REGION aws s3 ls "s3://$BUCKET/" | wc -l)"

            echo
            echo "==================== 크론 등록 (멱등) ===================="
            crontab -l > "$HOME/crontab.bak.$(date +%Y%m%d%H%M%S)" 2>/dev/null || true
            CRON_LINE="15 18 * * * $SCRIPT >> $HOME/upload_backups_s3.log 2>&1"
            ( crontab -l 2>/dev/null | grep -v 'upload_backups_s3.sh' ; echo "$CRON_LINE" ) | crontab -
            echo "등록 후 크론탭:"
            crontab -l

            echo
            echo "18:00 UTC(03:00 KST) 백업 → 18:15 UTC(03:15 KST) 업로드 순서로 동작합니다."
