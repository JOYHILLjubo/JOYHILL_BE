name: (5) Rotate DB password + JWT secret

on:
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Rotate secrets on server (values are generated/applied on-server only, never logged)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            NEW_DB_PASSWORD=$(openssl rand -hex 24)
            NEW_JWT_SECRET=$(openssl rand -hex 32)
            echo "Generated new DB password + JWT secret on the server (values are not printed)."

            # 1) Update Postgres password first
            sudo -u postgres psql -c "ALTER USER joy_user WITH PASSWORD '${NEW_DB_PASSWORD}';" > /dev/null
            echo "Postgres joy_user password updated."

            # 2) Verify the new password actually authenticates before touching the running app,
            #    so a typo/mismatch never leaves the app unable to start.
            PGPASSWORD="${NEW_DB_PASSWORD}" psql -h 127.0.0.1 -U joy_user -d joy -c "SELECT 1;" > /dev/null
            echo "New DB password verified against Postgres."

            # 3) Rewrite the systemd unit's Environment lines with the new values
            sudo sed -i "s|^Environment=DB_PASSWORD=.*|Environment=DB_PASSWORD=${NEW_DB_PASSWORD}|" /etc/systemd/system/joy-backend.service
            sudo sed -i "s|^Environment=JWT_SECRET=.*|Environment=JWT_SECRET=${NEW_JWT_SECRET}|" /etc/systemd/system/joy-backend.service
            echo "systemd unit updated."

            # 4) Reload + restart (this is the one unavoidable brief blip — the JVM must
            #    restart to pick up the new env vars). Run this workflow during a quiet window.
            sudo systemctl daemon-reload
            sudo systemctl restart joy-backend

            # 5) Confirm the backend actually came back up with the new secrets
            for i in $(seq 1 15); do
              sleep 1
              CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/users/birthdays || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "Backend responded 200 after restart (attempt ${i}s) — rotation complete."
                break
              fi
              if [ "$i" = "15" ]; then
                echo "WARNING: backend did not respond with 200 within 15s of restart."
                sudo systemctl status joy-backend --no-pager | tail -30
                exit 1
              fi
            done

            unset NEW_DB_PASSWORD NEW_JWT_SECRET
