name: (1) List PostgreSQL databases

on:
  workflow_dispatch:

jobs:
  list-db:
    runs-on: ubuntu-latest
    steps:
      - name: List PostgreSQL databases on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo -u postgres psql -l
