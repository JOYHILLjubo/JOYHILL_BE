name: (3) Check backend logs

on:
  workflow_dispatch:

jobs:
  check-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Tail joy-backend journal (errors/exceptions)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "=== recent ERROR/Exception lines with context ==="
            sudo journalctl -u joy-backend --since "20 min ago" --no-pager | grep -B2 -A 40 -iE "ERROR|Exception" | tail -300
