name: (11) Disk cleanup (apt cache / old kernels)

# apt 캐시(240M)와 더 이상 쓰지 않는 구 커널을 정리한다. 둘 다 재설치 가능한 캐시성 데이터라
# 서비스에 영향이 없다. 실행 전후 디스크 사용량을 함께 출력한다.
# 주의: 현재 부팅 커널은 autoremove 대상에서 제외되므로 커널이 통째로 지워질 일은 없다.

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean apt cache and unused kernels
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            echo "==================== 실행 전 ===================="
            df -h /
            echo "apt 캐시: $(sudo du -sh /var/cache/apt/archives 2>/dev/null | cut -f1)"
            echo "현재 부팅 커널: $(uname -r)"
            echo "설치된 커널 수: $(dpkg -l 'linux-image-*' | grep -c ^ii)"

            echo
            echo "==================== autoremove 시뮬레이션 (뭐가 지워지는지 먼저 확인) ===================="
            sudo apt-get autoremove --purge -s 2>&1 | grep -E "^(Remv|REMOVING|Remv:)|삭제|^[0-9]+ upgraded" | head -30 \
              || echo "(제거 대상 없음)"

            echo
            echo "==================== apt 캐시 정리 ===================="
            sudo apt-get clean
            echo "완료"

            echo
            echo "==================== 미사용 패키지/구 커널 제거 ===================="
            sudo DEBIAN_FRONTEND=noninteractive apt-get autoremove --purge -y 2>&1 | tail -20

            echo
            echo "==================== 실행 후 ===================="
            df -h /
            echo "apt 캐시: $(sudo du -sh /var/cache/apt/archives 2>/dev/null | cut -f1)"
            echo "설치된 커널 수: $(dpkg -l 'linux-image-*' | grep -c ^ii)"
            echo "현재 부팅 커널이 여전히 설치돼 있는지: $(dpkg -l | grep -c "$(uname -r)") 건"

            echo
            echo "==================== 서비스 정상 확인 ===================="
            sudo systemctl is-active joy-backend nginx postgresql
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://joyhill.kro.kr/api/users/birthdays || echo "000")
            echo "healthcheck code: $CODE"
            if [ "$CODE" = "000" ] || [ "${CODE:0:1}" = "5" ]; then
              echo "서버가 정상 응답하지 않음"
              exit 1
            fi
            echo "정상"
