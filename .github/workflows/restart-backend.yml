name: (10) Restart backend

# 배포 없이 백엔드만 재시작한다. IAM Role을 새로 붙인 뒤처럼 프로세스가 이전 상태를
# 캐싱하고 있을 때 사용한다(AWS SDK는 자격증명 조회 실패를 프로세스 수명 동안 물고 갈 수 있음).

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Restart joy-backend and verify startup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            echo "=== restart ==="
            sudo systemctl restart joy-backend
            sleep 15

            echo "=== service status ==="
            sudo systemctl is-active joy-backend

            echo "=== startup log ==="
            sudo journalctl -u joy-backend --since "2 min ago" --no-pager | grep -E "Started DemoApplication|Tomcat started|APPLICATION FAILED" | tail -5 \
              || echo "(기동 로그를 못 찾음 — 아래 에러 로그 확인)"

            echo "=== 기동 중 에러가 있었는지 ==="
            sudo journalctl -u joy-backend --since "2 min ago" --no-pager | grep -iE "ERROR|Exception" | tail -20 \
              || echo "(에러 없음)"

            # 헬스체크: 401/403/404도 "서버가 응답하고 있다"는 뜻이라 정상으로 본다.
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://joyhill.kro.kr/api/users/birthdays || echo "000")
            echo "healthcheck code: $CODE"
            if [ "$CODE" = "000" ] || [ "${CODE:0:1}" = "5" ]; then
              echo "서버가 정상 응답하지 않음"
              exit 1
            fi
            echo "정상 기동"
