name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew build -x test --no-daemon

      - name: Rename JAR (plain 제거)
        run: |
          JAR=$(ls build/libs/ | grep -v plain | grep '\.jar$')
          mv build/libs/$JAR build/libs/app.jar

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/app.jar"
          target: ${{ secrets.EC2_APP_DIR }}
          strip_components: 2

      # ddl-auto: validate라 새 테이블은 자동 생성되지 않음 — 재시작 전에 미리 적용.
      # IF NOT EXISTS라 매 배포마다 실행돼도 안전함(멱등).
      - name: Run pending DB migrations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            sudo -u postgres psql -d "${{ vars.DB_NAME }}" <<'SQL'
            CREATE TABLE IF NOT EXISTS sermon_notes (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                user_id BIGINT NOT NULL,
                note_date DATE NOT NULL,
                title VARCHAR(200),
                content TEXT NOT NULL,
                verse_tags VARCHAR(300),
                checklist_json TEXT,
                favorite BOOLEAN NOT NULL DEFAULT FALSE,
                created_at TIMESTAMP NOT NULL DEFAULT now()
            );
            ALTER TABLE sermon_notes OWNER TO joy_user;
            ALTER SEQUENCE IF EXISTS sermon_notes_id_seq OWNER TO joy_user;
            SQL

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            sudo systemctl restart joy-backend
            sleep 5
            sudo systemctl is-active joy-backend
